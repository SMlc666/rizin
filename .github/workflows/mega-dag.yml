name: Rizin Mega DAG (prototype)

# Isolated experiment: no pull_request or default-branch trigger.
on:
  push:
    branches:
      - ci/mega-dag-prototype
      - ci/mega-dag-balanced-asm
      - ci/mega-dag-lean-fixtures
      - ci/mega-dag-observability
      - ci/mega-dag-heavy-fastlane
  workflow_dispatch:
  # PR merges may restore compiler caches from their base branch.
  # A normal push on a sibling feature branch cannot do so.
  pull_request:
    branches:
      - ci/mega-dag-heavy-fastlane

permissions:
  contents: read

concurrency:
  group: mega-dag-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_BREAK_SYSTEM_PACKAGES: "1"

jobs:
  validate-dag:
    name: "00 / Validate graph and test inventory"
    # Do not run arbitrary fork PR code against the trusted base branch.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Check dependency graph, inventory and configuration
        run: |
          python3 -m pip install --user PyYAML
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          workflow = yaml.safe_load(Path('.github/workflows/mega-dag.yml').read_text())
          jobs = workflow['jobs']
          # Extras is explicitly excluded by rz-test's recursive default
          # loader because it requires additional external dependencies.
          expected = {'abi', 'analysis', 'archos', 'asm', 'cmd', 'esil',
                      'formats', 'inquiry', 'io', 'json', 'rzil', 'tools'}
          for category in expected:
              assert (Path('test/db') / category).is_dir(), category
          assert 'plan-regressions' in jobs
          assert 'plan-regressions' in jobs['regression-shards']['needs']
          assert 'plan-regressions' in jobs['regression-report']['needs']
          assert 'archos-heavy' in jobs['regression-report']['needs']
          assert 'archos-heavy' in jobs['quality-gate']['needs']
          assert set(jobs['archos-heavy']['needs']) == {'build-gcc', 'prepare-fixtures'}
          assert Path('.github/ci/asm-duration-weights.json').is_file()
          assert Path('.github/scripts/mega_dag_shards.py').is_file()
          state = {}
          def visit(job):
              assert job in jobs, f'missing job {job}'
              if state.get(job) == 'done':
                  return
              assert state.get(job) != 'visiting', f'cycle involving {job}'
              state[job] = 'visiting'
              deps = jobs[job].get('needs', [])
              if isinstance(deps, str):
                  deps = [deps]
              for dep in deps:
                  visit(dep)
              state[job] = 'done'
          for job in jobs:
              visit(job)
          assert 'regression-report' in jobs['quality-gate']['needs']
          assert 'quality-gate' in jobs
          print(f'Validated {len(jobs)} logical jobs and {len(expected)} regression categories.')
          PY
          python3 .github/scripts/mega_dag_shards.py --self-test
          python3 .github/scripts/ci_process_sampler.py --self-test
          python3 -m pip install --user PyYAML
          python3 .github/scripts/ci_critical_path.py --self-test

  plan-regressions:
    name: "05 / Plan historical-duration regression DAG"
    needs: validate-dag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Generate non-overlapping shard matrix
        id: plan
        run: |
          python3 .github/scripts/mega_dag_shards.py \
            --root test/db \
            --history .github/ci/asm-duration-weights.json \
            --manifest shard-plan.json \
            --output "$GITHUB_OUTPUT" \
            --asm-groups 4
      - name: Persist audited matrix manifest
        uses: actions/upload-artifact@v7
        with:
          name: regression-shard-plan
          path: shard-plan.json
          retention-days: 14
          if-no-files-found: error

  prepare-fixtures:
    name: "10 / Package regression fixtures"
    needs: validate-dag
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Checkout test binaries
        uses: actions/checkout@v6
        with:
          repository: rizinorg/rizin-testbins
          path: test/bins
          persist-credentials: false
      - name: Checkout rz-pipe helpers
        uses: actions/checkout@v6
        with:
          repository: rizinorg/rz-pipe
          path: test/rz-pipe
          persist-credentials: false
      - name: Archive reusable fixtures
        run: |
          test -d test/bins
          test -d test/rz-pipe/python
          du -sh test/bins/.git test/rz-pipe/.git || true
          # VCS history is not a test fixture: exclude it from the fan-out
          # artifact to avoid multiplying needless bytes across shards.
          tar --exclude='*/.git' --exclude='*/.git/*' -C test -czf "$RUNNER_TEMP/rizin-fixtures.tar.gz" bins rz-pipe
          (cd "$RUNNER_TEMP" && sha256sum rizin-fixtures.tar.gz > rizin-fixtures.tar.gz.sha256)
          ls -lh "$RUNNER_TEMP/rizin-fixtures.tar.gz"
      - name: Publish fixture artifact
        uses: actions/upload-artifact@v7
        with:
          name: rizin-fixtures
          path: |
            ${{ runner.temp }}/rizin-fixtures.tar.gz
            ${{ runner.temp }}/rizin-fixtures.tar.gz.sha256
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  build-gcc:
    name: "10 / GCC build + Meson suites + runtime artifact"
    needs: validate-dag
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 750M
    steps:
      - uses: actions/checkout@v6
      - name: Checkout external binary fixtures for Meson integration
        uses: actions/checkout@v6
        with:
          repository: rizinorg/rizin-testbins
          path: test/bins
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-wheel python3-setuptools libcapstone4 libcapstone-dev ccache
          python3 -m pip install --user meson ninja PyYAML
      - name: Restore GCC compiler objects from PR base/cache scope
        id: gcc-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: mega-gcc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('meson.build', 'subprojects/*.wrap') }}-${{ github.sha }}
          restore-keys: |
            mega-gcc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('meson.build', 'subprojects/*.wrap') }}-
      - name: Report GCC restored-cache key
        run: |
          echo "Restored key: ${{ steps.gcc-cache-restore.outputs.cache-matched-key }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact key hit: ${{ steps.gcc-cache-restore.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Build and run unit/integration suites
        env:
          CC: ccache gcc
          CXX: ccache g++
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ccache --max-size=750M
          ccache --zero-stats
          meson setup build --prefix="$HOME" -Dbuildtype=debugoptimized --werror
          meson compile -C build
          # Upstream integration suites expect installed themes/configuration
          # and other runtime resources; install before running the suites.
          meson install -C build
          export PATH="$HOME/bin:$PATH"
          export LD_LIBRARY_PATH="$HOME/lib/x86_64-linux-gnu:$HOME/lib:$HOME/lib64:${LD_LIBRARY_PATH:-}"
          meson test -C build --suite unit --print-errorlogs
          meson test -C build --suite integration --print-errorlogs
          ccache --show-stats
      - name: Package runtime for fan-out
        run: |
          set -e
          paths=(bin lib)
          if test -d "$HOME/share"; then paths+=(share); fi
          tar -C "$HOME" -czf "$RUNNER_TEMP/rizin-runtime.tar.gz" "${paths[@]}"
          (cd "$RUNNER_TEMP" && sha256sum rizin-runtime.tar.gz > rizin-runtime.tar.gz.sha256)
          test -s "$RUNNER_TEMP/rizin-runtime.tar.gz"
          ls -lh "$RUNNER_TEMP/rizin-runtime.tar.gz"
      - name: Publish runtime artifact
        uses: actions/upload-artifact@v7
        with:
          name: rizin-gcc-runtime
          path: |
            ${{ runner.temp }}/rizin-runtime.tar.gz
            ${{ runner.temp }}/rizin-runtime.tar.gz.sha256
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  cli-smoke:
    name: "20 / Validate staged CLI runtime"
    needs: build-gcc
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rizin-gcc-runtime
          path: ${{ runner.temp }}/runtime
      - name: Verify and extract runtime
        run: |
          (cd "$RUNNER_TEMP/runtime" && sha256sum -c rizin-runtime.tar.gz.sha256)
          tar -C "$HOME" -xzf "$RUNNER_TEMP/runtime/rizin-runtime.tar.gz"
      - name: Check installed CLI tools
        run: |
          export PATH="$HOME/bin:$PATH"
          export LD_LIBRARY_PATH="$HOME/lib/x86_64-linux-gnu:$HOME/lib:$HOME/lib64:$LD_LIBRARY_PATH"
          rizin -v
          rz-test -v
          rz-asm -v
          rz-bin -v

  regression-shards:
    name: "20 / rz-test / ${{ matrix.name }}"
    needs: [plan-regressions, build-gcc, prepare-fixtures]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan-regressions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-i386 libc6-dev debuginfod gdbserver libcapstone4 jq
          python3 -m pip install --user psutil requests
      - uses: actions/download-artifact@v8
        with:
          name: rizin-gcc-runtime
          path: ${{ runner.temp }}/runtime
      - name: Fetch external binary fixtures only for non-ASM tests
        if: matrix.category != 'asm'
        uses: actions/download-artifact@v8
        with:
          name: rizin-fixtures
          path: ${{ runner.temp }}/fixtures
      - name: Restore verified GCC runtime
        run: |
          (cd "$RUNNER_TEMP/runtime" && sha256sum -c rizin-runtime.tar.gz.sha256)
          tar -C "$HOME" -xzf "$RUNNER_TEMP/runtime/rizin-runtime.tar.gz"
      - name: Restore external fixtures only for non-ASM tests
        if: matrix.category != 'asm'
        run: |
          (cd "$RUNNER_TEMP/fixtures" && sha256sum -c rizin-fixtures.tar.gz.sha256)
          tar -C test -xzf "$RUNNER_TEMP/fixtures/rizin-fixtures.tar.gz"
          python3 -m pip install --user ./test/rz-pipe/python
      - name: Confirm ASM tests do not depend on external fixtures
        if: matrix.category == 'asm'
        run: |
          # Git checkout does not materialize the external test-binary repo.
          test ! -d test/rz-pipe/python
          test ! -d test/bins/elf
          echo 'ASM job deliberately runs without external test binaries or rz-pipe.'
      - name: Run regression shard
        env:
          SHARD_PATHS_JSON: ${{ toJSON(matrix.paths) }}
          SHARD_EXCLUDES_JSON: ${{ toJSON(matrix.exclude) }}
          SHARD_NAME: ${{ matrix.name }}
        run: |
          export PATH="$HOME/bin:$HOME/.local/bin:$PATH"
          export LD_LIBRARY_PATH="$HOME/lib/x86_64-linux-gnu:$HOME/lib:$HOME/lib64:${LD_LIBRARY_PATH:-}"
          export PKG_CONFIG_PATH="$HOME/lib/pkgconfig:$HOME/lib/x86_64-linux-gnu/pkgconfig:${PKG_CONFIG_PATH:-}"
          cd test
          # JSON -> separate shell arguments, with no shell eval or word splitting.
          mapfile -t shard_paths < <(python3 -c 'import json,os; [print(p) for p in json.loads(os.environ["SHARD_PATHS_JSON"])]')
          mapfile -t shard_excludes < <(python3 -c 'import json,os; [print(p) for p in json.loads(os.environ["SHARD_EXCLUDES_JSON"])]')
          test "${#shard_paths[@]}" -gt 0
          for path in "${shard_paths[@]}" "${shard_excludes[@]}"; do
            case "$path" in db/*) test -e "$path" ;; *) exit 1 ;; esac
          done
          exclude_args=()
          for path in "${shard_excludes[@]}"; do exclude_args+=(-e "$path"); done
          rz-test -n "${exclude_args[@]}" "${shard_paths[@]}" | tee "inventory-${SHARD_NAME}.txt"
          awk '/^Loaded [0-9]+ tests\./ { if ($2 + 0 > 0) ok=1 } END { exit !ok }' "inventory-${SHARD_NAME}.txt"
          rz-test -j "$(nproc)" -L -o "results-${SHARD_NAME}.json" "${exclude_args[@]}" "${shard_paths[@]}"
      - name: Persist independent shard result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-${{ matrix.name }}
          path: |
            test/results-${{ matrix.name }}.json
            test/inventory-${{ matrix.name }}.txt
          if-no-files-found: error
          retention-days: 7
  archos-heavy:
    name: "20 / Dedicated archos-heavy debugger regression"
    # Independent of the 12-way regression matrix concurrency limit.
    needs: [build-gcc, prepare-fixtures]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-i386 libc6-dev debuginfod gdbserver libcapstone4 jq
          python3 -m pip install --user psutil requests
      - name: Download verified GCC runtime
        uses: actions/download-artifact@v8
        with:
          name: rizin-gcc-runtime
          path: ${{ runner.temp }}/runtime
      - name: Download verified external fixtures
        uses: actions/download-artifact@v8
        with:
          name: rizin-fixtures
          path: ${{ runner.temp }}/fixtures
      - name: Restore runtime and external fixtures
        run: |
          (cd "$RUNNER_TEMP/runtime" && sha256sum -c rizin-runtime.tar.gz.sha256)
          (cd "$RUNNER_TEMP/fixtures" && sha256sum -c rizin-fixtures.tar.gz.sha256)
          tar -C "$HOME" -xzf "$RUNNER_TEMP/runtime/rizin-runtime.tar.gz"
          tar -C test -xzf "$RUNNER_TEMP/fixtures/rizin-fixtures.tar.gz"
          python3 -m pip install --user ./test/rz-pipe/python
      - name: Run and profile heavy debugger tests
        run: |
          export PATH="$HOME/bin:$HOME/.local/bin:$PATH"
          export LD_LIBRARY_PATH="$HOME/lib/x86_64-linux-gnu:$HOME/lib:$HOME/lib64:${LD_LIBRARY_PATH:-}"
          export PKG_CONFIG_PATH="$HOME/lib/pkgconfig:$HOME/lib/x86_64-linux-gnu/pkgconfig:${PKG_CONFIG_PATH:-}"
          cd test
          heavy="db/archos/linux-x64/dbg_cont_back"
          test -f "$heavy"
          rz-test -n "$heavy" | tee inventory-archos-heavy.txt
          awk '/^Loaded [0-9]+ tests[.]$/ { if ($2 + 0 > 0) ok=1 } END { exit !ok }' inventory-archos-heavy.txt
          python3 ../.github/scripts/ci_process_sampler.py \
            --output diagnostics-archos-heavy.json --interval 5 -- \
            rz-test -j "$(nproc)" -L -o results-archos-heavy.json "$heavy"
      - name: Persist heavy shard result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-archos-heavy
          path: |
            test/results-archos-heavy.json
            test/inventory-archos-heavy.txt
          if-no-files-found: error
          retention-days: 7
      - name: Persist heavy debugger process profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debugger-process-diagnostics
          path: test/diagnostics-archos-heavy.json
          if-no-files-found: error
          retention-days: 14

  sanitizer:
    name: "10 / ${{ matrix.compiler }} ASan+UBSan / Meson suites"
    needs: validate-dag
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 750M
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v6
      - name: Checkout external binary fixtures for Meson integration
        uses: actions/checkout@v6
        with:
          repository: rizinorg/rizin-testbins
          path: test/bins
          persist-credentials: false
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-wheel python3-setuptools libcapstone4 libcapstone-dev clang ccache
          python3 -m pip install --user meson ninja PyYAML
      - name: Restore ${{ matrix.compiler }} sanitizer compiler cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: mega-sanitize-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.compiler }}-asan-ubsan-${{ hashFiles('meson.build', 'subprojects/*.wrap') }}-${{ github.sha }}
          restore-keys: |
            mega-sanitize-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.compiler }}-asan-ubsan-${{ hashFiles('meson.build', 'subprojects/*.wrap') }}-
      - name: Build with sanitizers and execute Meson tests
        env:
          ASAN_OPTIONS: detect_leaks=0,allocator_may_return_null=1
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ccache --max-size=750M
          ccache --zero-stats
          export CC="ccache ${{ matrix.compiler }}"
          if test "${{ matrix.compiler }}" = clang; then
            export CXX="ccache clang++"
          else
            export CXX="ccache g++"
          fi
          options="-Dbuildtype=debugoptimized -Db_sanitize=address,undefined --werror"
          if test "${{ matrix.compiler }}" = clang; then
            options="$options -Db_lundef=false"
            export CFLAGS="-fno-sanitize=function"
            # Built code generators link against the Clang ASan runtime.
            # Without this, they can fail during Ninja's generation steps.
            asan_runtime="$(clang -print-file-name=libclang_rt.asan-x86_64.so)"
            test -f "$asan_runtime"
            export LD_LIBRARY_PATH="$(dirname "$asan_runtime"):${LD_LIBRARY_PATH:-}"
          fi
          sudo sysctl vm.mmap_rnd_bits=28 || true
          meson setup build --prefix="$HOME" $options
          meson compile -C build
          meson install -C build
          export PATH="$HOME/bin:$PATH"
          export LD_LIBRARY_PATH="$HOME/lib/x86_64-linux-gnu:$HOME/lib:$HOME/lib64:${LD_LIBRARY_PATH:-}"
          meson test -C build --suite unit --print-errorlogs
          meson test -C build --suite integration --print-errorlogs
      - name: Report ${{ matrix.compiler }} sanitizer compiler-cache performance
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats
            {
              echo '### ${{ matrix.compiler }} ASan/UBSan compiler-cache report'
              echo '```text'
              ccache --show-stats
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  compatibility:
    name: "10 / Build compatibility / ${{ matrix.variant }}"
    needs: validate-dag
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: portable
            meson_options: -Dbuildtype=debug --default-library=static -Dstatic_runtime=true -Dportable=true
          - variant: no-gpl
            meson_options: -Dbuildtype=release -Duse_gpl=false
          - variant: capstone-v6
            meson_options: -Dbuildtype=release -Duse_capstone_version=v6
    steps:
      - uses: actions/checkout@v6
      - name: Install compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-wheel python3-setuptools libcapstone4 libcapstone-dev
          python3 -m pip install --user meson ninja PyYAML
      - name: Build compatibility variant
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if test "${{ matrix.variant }}" = portable; then
            # Static glibc linking emits a warning that --werror escalates.
            # Match the upstream portable build's non-Werror configuration.
            meson setup build ${{ matrix.meson_options }}
          else
            meson setup build ${{ matrix.meson_options }} --werror
          fi
          meson compile -C build

  coverage:
    name: "10 / Coverage build, tests, offline artifact"
    needs: validate-dag
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - name: Checkout external binary fixtures for Meson integration
        uses: actions/checkout@v6
        with:
          repository: rizinorg/rizin-testbins
          path: test/bins
          persist-credentials: false
      - name: Install coverage toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-wheel python3-setuptools libcapstone4 libcapstone-dev
          python3 -m pip install --user meson ninja PyYAML gcovr
      - name: Build and execute coverage-instrumented tests
        id: coverage-build
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          meson setup build --prefix="$HOME" -Dbuildtype=debug -Db_coverage=true -Dchecks_level=3 --werror
          meson compile -C build
          meson install -C build
          export PATH="$HOME/bin:$PATH"
          export LD_LIBRARY_PATH="$HOME/lib/x86_64-linux-gnu:$HOME/lib:$HOME/lib64:${LD_LIBRARY_PATH:-}"
          meson test -C build --suite unit --print-errorlogs
          meson test -C build --suite integration --print-errorlogs
      - name: Generate coverage report even if tests fail
        if: always()
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Generate partial diagnostics when the test suite fails, but
          # still require non-empty reports and preserve the job failure.
          test -d build
          gcovr --gcov-ignore-parse-errors=all --txt build/coverage.txt --cobertura build/coverage.xml --merge-mode-functions=separate build
          test -s build/coverage.txt
          test -s build/coverage.xml
          grep -E '^TOTAL' build/coverage.txt || true
      - name: Persist coverage offline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mega-dag-coverage
          path: |
            build/coverage.txt
            build/coverage.xml
          if-no-files-found: error
          retention-days: 14

  regression-report:
    name: "90 / Regression inventory and results audit"
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [plan-regressions, regression-shards, archos-heavy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Retrieve planned matrix manifest
        uses: actions/download-artifact@v8
        with:
          name: regression-shard-plan
          path: shard-plan
      - name: Retrieve shard result manifests
        uses: actions/download-artifact@v8
        with:
          pattern: regression-*
          path: shard-results
      - name: Audit all required shard JSON reports (fail closed)
        run: |
          python3 - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          manifest = json.loads(Path('shard-plan/shard-plan.json').read_text())
          matrix_shards = manifest['matrix']['include']
          standalone = manifest['standalone']
          planned = matrix_shards + [standalone]
          names = [s['name'] for s in planned]
          categories = {'abi', 'analysis', 'archos', 'asm', 'cmd', 'esil',
                        'formats', 'inquiry', 'io', 'json', 'rzil', 'tools'}
          assert len(matrix_shards) == 15
          assert len(names) == 16 and len(names) == len(set(names))
          assert {s['category'] for s in planned} == categories
          heavy = manifest['isolated_archos_file']
          assert heavy == 'db/archos/linux-x64/dbg_cont_back'
          assert next(x for x in planned if x['name'] == 'archos')['exclude'] == [heavy]
          assert all(x['name'] != 'archos-heavy' for x in matrix_shards)
          assert standalone['name'] == 'archos-heavy'
          assert standalone['paths'] == [heavy]
          assert standalone['exclude'] == []
          assert all(not x['exclude'] for x in planned
                     if x['name'] not in {'archos', 'archos-heavy'})
          asm = [path for s in planned if s['category'] == 'asm'
                 for path in s['paths']]
          assert len(asm) == len(set(asm)) == manifest['discovered_asm_file_count']
          assert all(p.startswith('db/asm/') for p in asm)
          assert sum(s['category'] == 'asm' for s in planned) == 4

          lines = ['### Dynamic regression DAG: audited results', '',
                   '| Shard | Cases | OK | Broken | Failed | Fixed |',
                   '| --- | ---: | ---: | ---: | ---: | ---: |']
          errors = []
          fixed_total = total_cases = 0
          for shard in planned:
              name = shard['name']
              folder = Path('shard-results') / f'regression-{name}'
              report = folder / f'results-{name}.json'
              inventory = folder / f'inventory-{name}.txt'
              if not report.is_file() or not inventory.is_file():
                  errors.append(f'{name}: missing report or inventory')
                  lines.append(f'| {name} | missing | - | - | - | - |')
                  continue
              try:
                  cases = json.loads(report.read_text())
                  if not isinstance(cases, list) or not cases:
                      raise ValueError('empty or non-array results')
                  loaded = [int(t.split()[1]) for t in inventory.read_text().splitlines()
                            if t.startswith('Loaded ') and t.endswith(' tests.')]
                  if not loaded or loaded[-1] < 1 or loaded[-1] != len(cases):
                      raise ValueError(f'inventory/result mismatch: {loaded} vs {len(cases)}')
                  status = Counter(t['result'] for t in cases)
                  invalid = set(status) - {'ok', 'broken', 'failed', 'fixed'}
                  if invalid:
                      raise ValueError(f'invalid status: {invalid}')
                  total_cases += len(cases)
                  fixed_total += status['fixed']
                  lines.append(f'| {name} | {len(cases)} | {status["ok"]} | '
                               f'{status["broken"]} | {status["failed"]} | '
                               f'{status["fixed"]} |')
                  if status['fixed']:
                      print(f'::warning title=Expected-broken tests now pass::{name}: '
                            f'{status["fixed"]} fixed cases need baseline review')
                  if status['failed']:
                      errors.append(f'{name}: {status["failed"]} unexpected failures')
              except Exception as exc:
                  errors.append(f'{name}: {exc}')
                  lines.append(f'| {name} | invalid | - | - | - | - |')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('\n'.join(lines) + '\n')
              stream.write(f'\n**Audited tests:** {total_cases}; '
                           f'**fixed (nonfatal):** {fixed_total}; '
                           f'**ASM plan CPU loads:** '
                           f'{manifest["predicted_asm_shard_seconds"]}\n')
              if errors:
                  stream.write('\n**Audit errors:** ' + '; '.join(errors) + '\n')
          if errors:
              raise SystemExit('; '.join(errors))
          # The split must not silently remove tests from the 2026-10-19
          # Linux x86_64 baseline. Adding new tests is allowed.
          archos_cases = sum(len(json.loads((Path('shard-results') / f'regression-{name}' /
                              f'results-{name}.json').read_text()))
                             for name in ('archos', 'archos-heavy'))
          if archos_cases < 161:
              raise SystemExit(f'ARCHOS test coverage dropped: {archos_cases} < 161')
          print(f'All {len(planned)} planned shards produced validated results '
                f'for {total_cases} test cases; archos: {archos_cases}.')
          PY

  quality-gate:
    name: "99 / Aggregate all DAG results"
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs:
      - validate-dag
      - plan-regressions
      - prepare-fixtures
      - build-gcc
      - cli-smoke
      - regression-shards
      - archos-heavy
      - regression-report
      - sanitizer
      - compatibility
      - coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Produce complete gate report (fail closed)
        run: |
          {
            echo '### Mega DAG results'
            echo '| Logical stage | Result |'
            echo '| --- | --- |'
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$NEEDS_JSON"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS_JSON" >/dev/null || {
            echo "One or more stages failed, were cancelled, or were skipped."
            exit 1
          }
          echo 'All required DAG stages completed successfully.'

  performance-report:
    name: "100 / Observed DAG critical-path report"
    # This report runs even when quality-gate fails. It cannot make a
    # failed quality gate green; a diagnostic failure itself remains red.
    needs: quality-gate
    if: always() && needs.quality-gate.result != 'skipped' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install lightweight YAML reader
        run: python3 -m pip install --user PyYAML
      - name: Explain observed gate-blocking path from actual job timestamps
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/ci_critical_path.py \
            --workflow .github/workflows/mega-dag.yml \
            --report mega-dag-critical-path.json \
            --markdown mega-dag-critical-path.md
      - name: Keep machine-readable critical-path report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mega-dag-critical-path
          path: |
            mega-dag-critical-path.json
            mega-dag-critical-path.md
          if-no-files-found: error
          retention-days: 14
