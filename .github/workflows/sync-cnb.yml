name: Sync GitHub to CNB

on:
  push:
  workflow_dispatch:
    inputs:
      delete_cnb_branch:
        description: Delete a branch from CNB only when it no longer exists on GitHub
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sync-github-to-cnb
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      ${{ !(github.event_name == 'push' && github.event.deleted == true && github.ref_type == 'branch')
          && !(github.event_name == 'workflow_dispatch' && inputs.delete_cnb_branch != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync branches and tags to CNB
        uses: docker://tencentcom/git-sync
        env:
          PLUGIN_TARGET_URL: https://cnb.cool/urprotect-2026/rizin.git
          PLUGIN_AUTH_TYPE: https
          PLUGIN_USERNAME: cnb
          PLUGIN_PASSWORD: ${{ secrets.CNB_TOKEN }}
          PLUGIN_FORCE: "true"
          PLUGIN_PUSH_TAGS: "true"

  delete-cnb-branch:
    if: >-
      ${{ (github.event_name == 'push' && github.event.deleted == true && github.ref_type == 'branch')
          || (github.event_name == 'workflow_dispatch' && inputs.delete_cnb_branch != '') }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete branch from CNB if it is absent from GitHub
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_BRANCH: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name || inputs.delete_cnb_branch }}
        run: |
          set -euo pipefail

          if [[ -z "$CNB_TOKEN" ]]; then
            echo "::error::CNB_TOKEN secret is not configured"
            exit 1
          fi

          git check-ref-format --branch "$CNB_BRANCH" >/dev/null
          github_ref=$(git ls-remote --heads "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${CNB_BRANCH}")
          if [[ -n "$github_ref" ]]; then
            echo "::error::Refusing to delete '$CNB_BRANCH'; it still exists on GitHub"
            exit 1
          fi

          printf 'machine cnb.cool login cnb password %s\n' "$CNB_TOKEN" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"
          trap 'rm -f "$HOME/.netrc"' EXIT
          git push https://cnb.cool/urprotect-2026/rizin.git --delete "$CNB_BRANCH"
